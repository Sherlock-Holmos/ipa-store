name: Update AltSource

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build source.json from IPA releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/build_source.py
          --github-repo "${{ github.repository }}"
          --public-base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json icons
          if git diff --cached --quiet; then
            echo "No source changes detected."
          else
            git commit -m "chore: update AltSource"
            git push
          fi
